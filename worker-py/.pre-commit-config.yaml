
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        files: ^worker-py/
        types: [python]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        files: ^worker-py/
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        files: ^worker-py/
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: ^worker-py/
        types: [python]
      - id: pylint
        name: pylint
        entry: uv run pylint worker-py
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -r worker-py -x worker-py/.venv,worker-py/.ruff_cache,worker-py/.pytest_cache,node_modules
        language: system
        pass_filenames: false
